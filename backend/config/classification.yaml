# Parâmetros do classificador de áreas CANDIDATAS a café.
# Nenhum resultado fica no código: tudo que é limiar está aqui e é registrado
# no summary.json de cada análise (seção "method.parameters").
# A justificativa de cada valor está em docs/nota-pesquisa.md e no README.

radiometry:
  # Sentinel-2 L2A, processing baseline >= 04.00: reflectância = DN * 1e-4 - 0.1.
  # Usado só quando o GeoTIFF não traz scale/offset próprios (tags de banda).
  default_scale: 0.0001
  default_offset: -0.1
  nodata_dn: 0

bands:
  # Ordem esperada (1-based) no GeoTIFF enviado. Igual ao kit.
  blue: 1
  green: 2
  red: 3
  nir: 4

scl:
  # A SCL é usada como máscara de QUALIDADE, não de cobertura do solo:
  # mantidas 4 vegetação, 5 não vegetado, 6 água, 7 não classificado (a
  # cobertura é decidida pelos índices). Excluídas: 0 sem dado, 1 saturado,
  # 2 sombra/escuro, 3 sombra de nuvem, 8-9 nuvem, 10 cirrus, 11 neve.
  keep_classes: [4, 5, 6, 7]

indices:
  savi_l: 0.5          # Huete (1988): L = 0.5 para coberturas intermediárias
  # Janela (px) do desvio-padrão local do NDVI = 50 m. Só descritivo (atributo
  # dos polígonos): não entra nas regras.
  texture_window: 5

rules:
  # Piso de vigor: abaixo disso é solo exposto/pastagem seca na estação seca.
  ndvi_min: 0.45
  # Teto que separa dossel fechado (mata/eucalipto). Calculado por imagem
  # pelo método de Otsu sobre o NDVI dos pixels de vegetação válidos e limitado
  # a [dense_ndvi_floor, dense_ndvi_ceiling]. Se o Otsu cair fora, usa o default.
  dense_ndvi_default: 0.72
  dense_ndvi_floor: 0.65
  dense_ndvi_ceiling: 0.80
  # Separabilidade mínima do Otsu (eta = var_entre/var_total). Uma gaussiana
  # única dá ~0,64; abaixo de 0,70 o histograma não tem duas populações claras
  # e o limiar padrão é usado.
  otsu_min_separability: 0.70
  # Água/umidade: NDWI (McFeeters) acima disso é excluído.
  ndwi_max: 0.0
  # Manchas de dossel fechado com área >= dense_core_min_area_ha são tratadas
  # como remanescentes de mata/eucalipto; pixels a até dense_buffer_px delas são
  # descartados (borda de mata, mata ciliar, pixels mistos). 1 px = 10 m.
  dense_core_min_area_ha: 0.5
  dense_buffer_px: 1

temporal:
  # Só aplicado quando uma segunda data é enviada.
  # Café é perene: precisa continuar vegetado na outra data...
  ndvi_min_other: 0.45
  # ...e não pode variar demais (cultura anual, pastagem, desmatamento).
  max_abs_ndvi_change: 0.25
  # Na segunda data (sem SCL), azul acima disso é tratado como nuvem (NoData).
  cloud_blue_min: 0.20
  # Fração mínima da cena principal coberta pela segunda data / pela SCL.
  min_overlap: 0.5

morphology:
  opening_iterations: 1    # remove pixels isolados e pontes de 1 px
  min_area_ha: 0.5         # = 50 pixels de 10 m
